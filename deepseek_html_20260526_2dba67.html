<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل بيانات الأطباء</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Tahoma', sans-serif;
        }
        body {
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-card {
            background: white;
            max-width: 520px;
            width: 100%;
            margin: auto;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }
        .hospital-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .hospital-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e3a5f;
            margin: 0 0 4px 0;
        }
        .department {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c7da0;
            margin: 0 0 12px 0;
        }
        .form-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0b2b3b;
            margin: 0 0 16px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        .field-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #0b2b3b;
            font-size: 1rem;
        }
        .required-star {
            color: #d32f2f;
            margin-right: 4px;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1.5px solid #cfdfed;
            border-radius: 24px;
            background-color: #fff;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44, 125, 160, 0.2);
        }
        input:user-invalid,
        select:user-invalid,
        textarea:user-invalid {
            border-color: #d32f2f;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s, opacity 0.2s;
            margin-top: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background: #247291;
        }
        button:active {
            transform: scale(0.97);
            background: #1f5e7a;
        }
        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .status-msg {
            margin-top: 0;
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 40px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success {
            background: #dff0e4;
            color: #1e6f3f;
            border: 1px solid #b2d8b2;
            display: block;
        }
        .error {
            background: #ffe6e5;
            color: #b71c1c;
            border: 1px solid #ffcdd2;
            display: block;
        }
        .loading {
            background: #e9ecef;
            color: #2c7da0;
            display: block;
        }
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #2c7da0;
            margin-top: 20px;
            font-weight: 500;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .conditional-group {
            display: none;
        }
        .conditional-group.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="hospital-header">
            <div class="hospital-name">مستشفى سوهاج العام</div>
            <div class="department">قسم النساء والتوليد</div>
            <div class="form-title">📋 تسجيل بيانات الأطباء</div>
        </div>

        <form id="dataForm" novalidate>
            <div class="field-group">
                <label for="name">الاسم <span class="required-star">*</span></label>
                <input type="text" id="name" name="name" placeholder="الاسم الكامل" required autocomplete="name">
            </div>

            <div class="field-group">
                <label for="jobDegree">الدرجة الوظيفية <span class="required-star">*</span></label>
                <select id="jobDegree" name="jobDegree" required>
                    <option value="" disabled selected>-- اختر --</option>
                    <option value="طبيب مقيم (نيابة)">طبيب مقيم (نيابة)</option>
                    <option value="طبيب مقيم (زمالة)">طبيب مقيم (زمالة)</option>
                    <option value="مساعد أخصائي">مساعد أخصائي</option>
                    <option value="أخصائي">أخصائي</option>
                    <option value="استشاري">استشاري</option>
                </select>
            </div>

            <div class="field-group">
                <label for="graduationYear">دفعة التخرج <span class="required-star">*</span></label>
                <input type="number" id="graduationYear" name="graduationYear" placeholder="مثال: 2015" required>
            </div>

            <div class="field-group">
                <label for="qualifications">المؤهلات <span class="required-star">*</span></label>
                <textarea id="qualifications" name="qualifications" placeholder="أدخل المؤهلات (يمكنك كتابة عدة أسطر)" required></textarea>
            </div>

            <div class="field-group">
                <label for="joiningYear">سنة الالتحاق بالمستشفى <span class="required-star">*</span></label>
                <input type="number" id="joiningYear" name="joiningYear" placeholder="مثال: 2020" required>
            </div>

            <div class="field-group">
                <label for="workStatus">أساسي أو منتدب <span class="required-star">*</span></label>
                <select id="workStatus" name="workStatus" required>
                    <option value="" disabled selected>-- اختر --</option>
                    <option value="أساسي">أساسي</option>
                    <option value="منتدب من مستشفى سوهاج العام">منتدب من مستشفى سوهاج العام</option>
                    <option value="منتدب إلى مستشفى سوهاج العام">منتدب إلى مستشفى سوهاج العام</option>
                </select>
            </div>

            <div id="conditionalFields" class="conditional-group">
                <div class="field-group">
                    <label for="otherHospital">المستشفى الأخرى <span class="required-star">*</span></label>
                    <input type="text" id="otherHospital" name="otherHospital" placeholder="اسم المستشفى الأخرى">
                </div>
                <div class="field-group">
                    <label for="startDate">تاريخ الانتداب <span class="required-star">*</span></label>
                    <input type="date" id="startDate" name="startDate">
                </div>
                <div class="field-group">
                    <label for="endDate">تاريخ انتهاء الانتداب <span class="required-star">*</span></label>
                    <input type="date" id="endDate" name="endDate">
                </div>
            </div>

            <div class="field-group">
                <label for="phone">رقم الهاتف <span class="required-star">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" required
                pattern="[0-9]{10,15}" title="أدخل رقم هاتف صالح (10-15 رقم)" autocomplete="tel">
            </div>

            <div class="field-group">
                <label for="email">البريد الإلكتروني <span class="required-star">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required autocomplete="email">
            </div>

            <div class="field-group">
                <label for="notes">ملاحظات إضافية (اختياري)</label>
                <textarea id="notes" name="notes" placeholder="أي ملاحظات تريد إضافتها..."></textarea>
            </div>

            <div id="statusMsg" class="status-msg" role="status" aria-live="polite"></div>

            <button type="submit" id="submitBtn">إرسال البيانات</button>
        </form>
        <footer>وفقنا الله وإياكم</footer>
    </div>

    <script>
        (function() {
            // 🔁 Your deployed Google Apps Script Web App URL
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwT3myDcRl6cqwtsVF-ee1RToTQFHckTiEV9blwkigywbsHXuJRqWdoxJ5Lz5S_O55B/exec';

            const form = document.getElementById('dataForm');
            const statusDiv = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            const phoneInput = document.getElementById('phone');
            const workStatus = document.getElementById('workStatus');
            const conditionalFields = document.getElementById('conditionalFields');
            const otherHospitalInput = document.getElementById('otherHospital');
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');

            let clearTimer = null;

            function toggleConditionalFields() {
                const status = workStatus.value;
                const isSeconded = status === 'منتدب من مستشفى سوهاج العام' || status === 'منتدب إلى مستشفى سوهاج العام';
                
                if (isSeconded) {
                    conditionalFields.classList.add('show');
                    otherHospitalInput.setAttribute('required', '');
                    startDateInput.setAttribute('required', '');
                    endDateInput.setAttribute('required', '');
                } else {
                    conditionalFields.classList.remove('show');
                    otherHospitalInput.removeAttribute('required');
                    startDateInput.removeAttribute('required');
                    endDateInput.removeAttribute('required');
                    otherHospitalInput.value = '';
                    startDateInput.value = '';
                    endDateInput.value = '';
                }
            }

            workStatus.addEventListener('change', toggleConditionalFields);
            toggleConditionalFields();

            function showMessage(msg, type) {
                if (clearTimer) {
                    clearTimeout(clearTimer);
                    clearTimer = null;
                }
                statusDiv.textContent = msg;
                statusDiv.className = `status-msg ${type}`;
                statusDiv.style.display = 'block';

                if (type === 'success' || type === 'error') {
                    clearTimer = setTimeout(() => {
                        statusDiv.style.display = 'none';
                        statusDiv.className = 'status-msg';
                        clearTimer = null;
                    }, 6000);
                }
            }

            function hideMessage() {
                if (clearTimer) {
                    clearTimeout(clearTimer);
                    clearTimer = null;
                }
                statusDiv.style.display = 'none';
                statusDiv.className = 'status-msg';
            }

            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessage();

                const name = document.getElementById('name').value.trim();
                const jobDegree = document.getElementById('jobDegree').value;
                const graduationYear = document.getElementById('graduationYear').value.trim();
                const qualifications = document.getElementById('qualifications').value.trim();
                const joiningYear = document.getElementById('joiningYear').value.trim();
                const workStatusValue = workStatus.value;
                const otherHospital = otherHospitalInput.value.trim();
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;
                const phone = phoneInput.value.trim();
                const email = document.getElementById('email').value.trim();
                const notes = document.getElementById('notes').value.trim();

                if (!name || !jobDegree || !graduationYear || !qualifications || !joiningYear || !workStatusValue || !phone || !email) {
                    showMessage('❌ يرجى تعبئة جميع الحقول المطلوبة (*)', 'error');
                    return;
                }

                const gradYearNum = Number(graduationYear);
                const joinYearNum = Number(joiningYear);
                if (isNaN(gradYearNum) || !Number.isInteger(gradYearNum)) {
                    showMessage('❌ دفعة التخرج يجب أن تكون رقماً صحيحاً', 'error');
                    return;
                }
                if (isNaN(joinYearNum) || !Number.isInteger(joinYearNum)) {
                    showMessage('❌ سنة الالتحاق يجب أن تكون رقماً صحيحاً', 'error');
                    return;
                }

                const phoneRegex = /^[0-9]{10,15}$/;
                if (!phoneRegex.test(phone)) {
                    showMessage('❌ رقم الهاتف يجب أن يحتوي على 10-15 رقماً فقط', 'error');
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showMessage('❌ يرجى إدخال بريد إلكتروني صحيح', 'error');
                    return;
                }

                const isSeconded = workStatusValue === 'منتدب من مستشفى سوهاج العام' || workStatusValue === 'منتدب إلى مستشفى سوهاج العام';
                if (isSeconded) {
                    if (!otherHospital) {
                        showMessage('❌ يرجى إدخال اسم المستشفى الأخرى', 'error');
                        return;
                    }
                    if (!startDate) {
                        showMessage('❌ يرجى إدخال تاريخ الانتداب', 'error');
                        return;
                    }
                    if (!endDate) {
                        showMessage('❌ يرجى إدخال تاريخ انتهاء الانتداب', 'error');
                        return;
                    }
                }

                // ✅ Fix: prepend an apostrophe to force text format in Google Sheets
                const phoneWithApostrophe = phone ? "'" + phone : '';

                const payload = new URLSearchParams({
                    name,
                    jobDegree,
                    graduationYear,
                    qualifications,
                    joiningYear,
                    workStatus: workStatusValue,
                    otherHospital: otherHospital || '',
                    startDate: startDate || '',
                    endDate: endDate || '',
                    phone: phoneWithApostrophe,   // ← sends '0512345678
                    email,
                    notes: notes || ''
                });

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';
                showMessage('⏳ يتم الإرسال إلى جدول البيانات...', 'loading');

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: payload
                    });

                    const contentType = response.headers.get('content-type') || '';
                    let result = null;
                    if (contentType.includes('application/json')) {
                        result = await response.json();
                    }

                    if (response.ok || (result && result.status === 'success')) {
                        showMessage('✅ تم الإرسال بنجاح! شكرا لك', 'success');
                        form.reset();
                        toggleConditionalFields();
                        form.querySelectorAll('input, select, textarea').forEach(el => {
                            el.classList.remove('user-invalid');
                        });
                    } else {
                        const errMsg = result && result.message ? result.message : 'استجاب الخادم بخطأ غير متوقع';
                        showMessage('⚠️ ' + errMsg, 'error');
                        console.error('Server response:', response.status, result);
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    if (error.name === 'TypeError' && error.message.includes('NetworkError')) {
                        showMessage('⚠️ لا يوجد اتصال بالإنترنت، تحقق من الشبكة', 'error');
                    } else if (error.name === 'TypeError' && error.message.includes('CORS')) {
                        showMessage('⚠️ خطأ CORS: تأكد من إعداد تطبيق Google Apps Script بشكل صحيح', 'error');
                    } else {
                        showMessage('⚠️ حدث خطأ في الإرسال، حاول مرة أخرى', 'error');
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'إرسال البيانات';
                }
            });
        })();
    </script>
</body>
</html>
